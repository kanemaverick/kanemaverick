name: Refresh profile card

on:
  schedule:
    - cron: "17 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - "assets/portrait.txt"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Read public activity and render the cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B scripts/render_profile.py
      - name: Publish changed cards
        run: |
          git add -- assets/desktop.svg assets/mobile.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public profile stats"
          git push origin HEAD:main
